# 环境与路径约定。所有脚本从这里读，不要硬编码路径。
paths:
  exp_root: .
  models: models
  data: data
  logs: logs
  runs: runs

models:
  embedder: models/all-MiniLM-L6-v2   # 句向量，384 维
  embed_dim: 384
  llm: models/Qwen2.5-0.5B-Instruct   # 开发期占位 backbone，见 README「模型选择」

runtime:
  device: cpu
  dtype: float32
  num_threads: 2
  seed: 0
